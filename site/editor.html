<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Marionette editor — Motion Puppet</title>
	<meta name="description" content="Choose a marionette and string it: which links are strings and which are rods, tuned to the millimetre and tried on the real physics.">
	<meta name="theme-color" content="#0a0507">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23160b0d'/%3E%3Cpath d='M12 14h40M32 8v12M18 14v18M46 14v18M32 20v8' stroke='%23d9a441' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='36' r='8' fill='%23e8b98a'/%3E%3Crect x='24' y='45' width='16' height='13' rx='4' fill='%231f6f6b'/%3E%3C/svg%3E">
	<link rel="stylesheet" href="css/studio.css">
	<script type="importmap">
	{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/three-addons/" } }
	</script>
</head>
<body>
	<div class="app app--editor">
		<header class="topbar">
			<div class="topbar__brand"><b>Motion Puppet</b><span>Marionette</span></div>
			<input class="topbar__name" id="name" type="text" maxlength="40" aria-label="Name of this marionette" title="Name of this marionette" spellcheck="false">
			<span class="topbar__saved" id="saved" aria-live="polite"></span>
			<span class="topbar__gap"></span>
			<div class="topbar__group">
				<button class="btn btn--icon" id="btn-undo" type="button" title="Undo (⌘Z / Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 16 16"><path d="M6.5 2 2 6l4.5 4V7.2h2.7a2.6 2.6 0 0 1 0 5.2H6v1.8h3.2a4.4 4.4 0 0 0 0-8.8H6.5z"/></svg></button>
				<button class="btn btn--icon" id="btn-redo" type="button" title="Redo (⇧⌘Z / Ctrl+Y)" aria-label="Redo"><svg viewBox="0 0 16 16"><path d="M9.5 2 14 6l-4.5 4V7.2H6.8a2.6 2.6 0 0 0 0 5.2H10v1.8H6.8a4.4 4.4 0 0 1 0-8.8h2.7z"/></svg></button>
			</div>
			<div class="topbar__group">
				<button class="btn" id="btn-import" type="button" title="Load a marionette from a JSON file">Import</button>
				<button class="btn" id="btn-export" type="button" title="Save this marionette as a JSON file">Export</button>
				<button class="btn btn--danger" id="btn-default" type="button" title="Load the default marionette: the gentleman on his twelve strings">Load default</button>
			</div>
			<button class="btn btn--on" id="btn-stage" type="button" title="Save this marionette and open the stage with it">Use on stage</button>
			<nav aria-label="Motion Puppet">
				<a href="./">Stage</a>
				<a href="editor.html" aria-current="page">Marionette</a>
				<a href="studio.html">Studio</a>
			</nav>
			<button class="btn btn--icon" id="btn-help" type="button" aria-pressed="false" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
		</header>
		<main class="view" id="view">
			<canvas id="stage" aria-label="The marionette, its control bars and its strings and rods"></canvas>
			<div class="view__tools">
				<button class="btn" id="btn-reset" type="button" title="Stand the puppet back up (R)">Reset puppet</button>
				<button class="btn" id="btn-slow" type="button" aria-pressed="false" title="Quarter speed (Space)">Slow motion</button>
				<div class="seg" id="views" role="group" aria-label="Where to look from"></div>
			</div>
			<div class="view__tag" id="tag" hidden></div>
			<p class="view__hint">Click a string or rod to select it · drag to look round · right-drag to slide · wheel to zoom</p>
			<div class="bench" id="bench" aria-label="Test bench"></div>
			<div class="help" id="help" hidden>
				<header><h2>Keyboard</h2><button class="btn btn--quiet" id="help-close" type="button" aria-label="Close">✕</button></header>
				<dl></dl>
				<p>In a number box: <kbd>↑</kbd> <kbd>↓</kbd> step, <kbd>Shift</kbd> ten steps, <kbd>Alt</kbd> a tenth. Double-click a label to put its value back.</p>
			</div>
		</main>
		<aside class="side" id="side" aria-label="Marionette"></aside>
	</div>

	<div class="toast" id="toast" role="status" aria-live="polite"></div>
	<div class="curtain" id="curtain">
		<div>
			<h1>Marionette editor</h1>
			<p id="curtain-text">Carving the puppet…</p>
		</div>
	</div>
	<noscript><p style="position:fixed;inset:0;display:grid;place-items:center">This page needs JavaScript and WebGL.</p></noscript>
	<script type="module" src="js/studio/editor.js"></script>
</body>
</html>
